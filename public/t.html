<!-- Delningsförhandsvisning. Det här är den ENDA SEO-relaterade åtgärden på /t

     automatiserad webbläsare, och sidan hänger då på "Laddar tävling…".

     TEXTEN MÅSTE VARA GENERISK. Skalet delas av VARJE /t-URL, så allt som
     bakas in här gäller alla tävlingar samtidigt — en tävlingsspecifik text
     vore både fel för de andra och en läcka. Den tävlingsspecifika titeln
     sätts av public.js när datat finns, för människor i en riktig webbläsare.

     Ingen og:url: den skulle behöva vara tävlingsspecifik, och en skrapa
     faller tillbaka på den adress den faktiskt hämtade — vilket är rätt. -->
