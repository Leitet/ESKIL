<svg xmlns="http://www.w3.org/2000/svg" width="1149" height="418" viewBox="78 57 1149 418">
  <defs><style>
    /* Typsnittet ÄR filen. En SVG som visas via &lt;img&gt; får inte hämta något
       externt — varken webbfonter eller CSS från sidan — så den renderade
       ordbilden i vad enheten råkade ha: Arial på Mac och Windows, Roboto på
       Android, DejaVu på Linux. Logotypen bytte alltså form efter besökare.

       Inbakat här ligger Arimo, som är metriskt identisk med Arial och
       licensierad under OFL. Utseendet är därför detsamma som förut, men nu
       likadant överallt. Delmängden innehåller bara de tecken som används
       (3,8 kB) — hämtad med text=-parametern mot Google Fonts. */
    @font-face {
      font-family: 'ESKIL Wordmark';
      src: url(data:font/woff2;base64,) format('woff2');
      font-weight: 400 700;
      font-style: normal;
    }
  </style></defs><rect x="78" y="57" width="100%" height="100%" fill="#FFFFFF"/>
