<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="ESKIL">
  <!--
    ESKIL:s favicon. Detta är INTE eskil-symbol-*.svg nedskalad — den blir grå
    gröt vid 16 px, vilket är hela skälet till att den här filen finns. Tre
    beslut, alla fattade genom att rendera i 16/24/32/48 px och titta:

    1. PLATTAN, inte en fristående mark. En favicon-SVG kan byta färg med
       flikraden via prefers-color-scheme, men Safari ignorerar media-frågan i
       favicons i ALLA versioner — en temaväxlande mark visar därför sin
       reservfärg för varje Apple-användare, och den färgen måste kompromissa
       mellan ljus och mörk flikrad (mätt: 3,05:1 mot Safaris grå remsa). En
       platta bär kontrasten själv och beter sig likadant i Safari, i äldre
       webbläsare och i PNG-export. Lyftet i mörkt läge är en FÖRBÄTTRING
       ovanpå en fungerande grund, aldrig mekanismen: utan det sjunker
       Scoutblå mot en mörk flikrad (1,3:1) och bara liljan syns — vilket
       fortfarande läser.

    2. BLADEN ÄR ORIGINALETS SVEPTA HALVMÅNAR, feta med en kontur i samma
       färg. Tunna former blir grå antialias vid 16 px, inte vita blad. Räta
       ut dem inte för att vinna skärpa: en provskiss som gjorde det blev en
       KRONA vid 32 px, inte en lilja. Fetare än stroke-width 10 provades
       också — då slöts mellanrummen mellan bladen och marken blev en klump.

    3. BASEN SMALNAR NEDÅT och ligger på pixelrutnätet (y 48..56 = exakt 2 px
       vid 16 px; 1 px = 4 enheter i den här viewBoxen). Originalets ellips
       plus två 6-enhetsstreck plus droppen är 0,4 px var vid 16 px, alltså
       smuts — de är strukna. Ett RAKT streck under tre spröt läser som en
       kronbas; en skål gör det inte.

    Ändrar du geometrin: rendera om i 16 px och titta på en förstoring med
    image-rendering: pixelated, aldrig en utjämnad uppskalning — den döljer
    precis det som går sönder.
  -->
  <style>
    .platta { fill: #003660 }
    @media (prefers-color-scheme: dark) { .platta { fill: #17456B } }
  </style>
  <rect class="platta" width="64" height="64" rx="13"/>
  <g fill="#FFFFFF">
    <g transform="translate(6,4.88) scale(0.26)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round">
      <path d="M100 12 C 92 38, 90 60, 90 92 C 90 118, 95 138, 100 158 C 105 138, 110 118, 110 92 C 110 60, 108 38, 100 12 Z"/>
      <path d="M38 32 C 44 62, 52 86, 68 108 C 78 122, 84 132, 82 152 C 78 138, 70 132, 58 128 C 44 124, 34 118, 30 102 C 26 82, 28 58, 38 32 Z"/>
      <path d="M162 32 C 156 62, 148 86, 132 108 C 122 122, 116 132, 118 152 C 122 138, 130 132, 142 128 C 156 124, 166 118, 170 102 C 174 82, 172 58, 162 32 Z"/>
    </g>
    <path d="M16 48 H48 L44 56 H20 Z"/>
  </g>
</svg>
